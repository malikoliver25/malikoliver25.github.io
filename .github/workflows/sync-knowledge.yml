name: Sync NOVA Knowledge (GitHub)

on:
  push:
    branches: [main]
    paths:
      - 'src/data/**'
      - 'scripts/**'
  schedule:
    - cron: '17 3 * * *' # nightly 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync GitHub -> agent-knowledge.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/agent-knowledge.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "nova-sync"
          git config user.email "nova-sync@users.noreply.github.com"
          git add src/data/agent-knowledge.json
          git commit -m "chore: sync NOVA knowledge from GitHub [skip ci]"
          git push
